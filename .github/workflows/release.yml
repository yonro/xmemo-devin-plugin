name: Publish XMemo Devin package

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*.*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Enforce candidate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_gate.py "$RELEASE_TAG"
      - name: Check generated workflows
        run: python scripts/sync_skills.py --check
      - name: Validate package
        run: python scripts/validate_package.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=zip --output="dist/XMemo-for-Devin-${version}.zip" "$GITHUB_SHA"
          sha256sum "dist/XMemo-for-Devin-${version}.zip" > "dist/XMemo-for-Devin-${version}.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "XMemo for Devin ${GITHUB_REF_NAME#v}" --generate-notes --prerelease
